name: DouDuo
options:
  bundleIdPrefix: me.rrmm
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true
packages:
  VLCKitSPM:
    path: Vendor/VLCKit
settings:
  base:
    MARKETING_VERSION: 1.6.0
    CURRENT_PROJECT_VERSION: "113"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  DouDuo:
    type: application
    platform: iOS
    sources:
      - path: DouDuo
      - path: DouDuoWatchShared
    dependencies:
      - package: VLCKitSPM
      - target: DouDuoWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.rrmm.douduo
        PRODUCT_NAME: DouDuo
        INFOPLIST_KEY_CFBundleDisplayName: DouDuo
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: YES
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 保存视频和图集到相册
    info:
      path: DouDuo/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # 后台播放：默认仍是切后台就停声；只有「更多」菜单里打开「后台播放」才会继续响（代码里按开关判断）
        UIBackgroundModes: [audio]
        # ProMotion：iPhone 默认把 App 限制在 60Hz，必须声明这一项才能跑 120Hz（弹幕滚动、翻页更顺）
        CADisableMinimumFrameDurationOnPhone: true
  # Apple Watch 伴侣：不登录，只显示 iPhone 推来的消息和视频（见 DDWatchBridge.swift）
  DouDuoWatch:
    type: application
    platform: watchOS
    sources:
      - path: DouDuoWatch
      - path: DouDuoWatchShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.rrmm.douduo.watchkitapp
        PRODUCT_NAME: DouDuoWatch
        INFOPLIST_KEY_CFBundleDisplayName: DouDuo
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "4"
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: me.rrmm.douduo
        INFOPLIST_KEY_WKApplication: YES
  DouDuoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DouDuoUITests
    dependencies:
      - target: DouDuo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.rrmm.douduo.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: DouDuo
  DouDuoVideoFitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DouDuo/DYVideoFit.swift
      - path: DouDuo/DYShareLinkParse.swift
      - path: DouDuoTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.rrmm.douduo.videofit.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  DouDuo:
    build:
      targets:
        DouDuo: all
        DouDuoUITests: [test]
    test:
      targets:
        - DouDuoUITests
  DouDuoVideoFitTests:
    build:
      targets:
        DouDuoVideoFitTests: [test]
    test:
      targets:
        - DouDuoVideoFitTests
